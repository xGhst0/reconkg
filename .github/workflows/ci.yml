#  CI for reconkg.
#
#  The install step deliberately uses `pip install .[dev]` rather than
#  `pip install -r requirements-dev.txt`: the point of this cycle is that the
#  declared dependency set must be sufficient on its own. Installing from
#  requirements would let an undeclared runtime dep (RC-22: defusedxml) keep
#  passing CI forever.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      # If the hardened XML path is not the one that runs, the importer is in
      # its RC-22 fallback and the build is lying about what it tested.
      - name: Assert defusedxml is the parser actually in use
        run: |
          python -c "import reconkg.importers as i; assert i.DEFUSED, \
            'defusedxml missing: importer is on the stdlib fallback path'"

      - name: pytest
        run: python -m pytest -q

      # Two modules minimum, per the cycle brief. A non-zero exit means a
      # mutant survived -- behaviour no test pins.
      - name: Mutation harness (vulnref, importers)
        run: python audit/mutation.py vulnref importers

  mutation-full:
    #  The full harness is slow, so it runs once on a single interpreter
    #  rather than across the matrix. It still gates the build.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Mutation harness (all targets)
        run: python audit/mutation.py
